<!-- @dsCard group="Status" height=120 subtitle="Neutra, acentos e status" -->
<div style="font-family:var(--font-sans);display:flex;flex-direction:column;gap:12px;padding:24px;background:var(--bg);color:var(--fg)">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--border);color:var(--fg)">Neutra</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--highlight);color:var(--highlight-fg)">Âmbar</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg)">Petróleo</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--info);color:var(--info-fg)">Cobalto</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--inverse);color:var(--inverse-fg)">Escura</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--border);padding:5px 9px">Contorno</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg)">Concluído</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--highlight);color:var(--highlight-fg)">Em atenção</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--info);color:var(--info-fg)">Informação</span>
<span style="padding:6px 10px;border-radius:var(--r-xs);font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;background:var(--danger);color:var(--danger-fg)">Erro</span>
</div></div>
