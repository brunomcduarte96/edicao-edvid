<style>
  .cv{position:relative;width:960px;height:288px;background:var(--bg);font-family:var(--font-sans);overflow:hidden}
  .cv svg{position:absolute;left:0;top:0}
  .slab{fill:var(--inverse)} .tl{fill:var(--teal)} .am{fill:var(--amber)} .co{fill:var(--cobalt)} .sf{fill:var(--surface)}
  .t{rx:var(--r-md)}
