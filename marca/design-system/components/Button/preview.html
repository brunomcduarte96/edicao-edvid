<!-- @dsCard group="Ações" height=140 subtitle="Primário, destaque, secundário, terciário e estados" -->
<div style="font-family:var(--font-sans);display:flex;flex-direction:column;gap:12px;padding:24px;background:var(--bg);color:var(--fg)">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:0;background:var(--inverse);color:var(--inverse-fg)">Primário</button>
<button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:0;background:var(--accent);color:var(--accent-fg)">Destaque</button>
<button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:1px solid var(--fg);background:transparent;color:var(--fg)">Secundário</button>
<button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:0;background:transparent;color:var(--fg);padding:0 12px;text-decoration:underline;text-underline-offset:4px">Terciário</button>
<button type="button" disabled style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:0;background:var(--surface);color:var(--fg-muted);cursor:default">Desabilitado</button>
<button type="button" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:var(--r-sm);font:600 15px/1 var(--font-sans);cursor:pointer;border:0;background:var(--inverse);color:var(--inverse-fg);outline:2px solid var(--link);outline-offset:2px">Foco</button>
</div></div>
<script></script>
