<!-- @dsCard group="Formulários" height=150 subtitle="Padrão, foco, erro e desabilitado" -->
<div style="font-family:var(--font-sans);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:24px;background:var(--bg);color:var(--fg)">
<div style="display:flex;flex-direction:column;gap:6px"><label for="a" style="font:600 14px/1.4 var(--font-sans)">Nome</label><input id="a" type="text" placeholder="Seu nome" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font:400 15px/1 var(--font-sans);border:1px solid var(--border)"><span style="font-size:13px;color:var(--fg-muted)">Texto de ajuda.</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="b" style="font:600 14px/1.4 var(--font-sans)">E-mail</label><input id="b" type="email" value="nome@empresa.com.br" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font:400 15px/1 var(--font-sans);border:2px solid var(--fg)"><span style="font-size:13px;color:var(--fg-muted)">Em foco.</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="c" style="font:600 14px/1.4 var(--font-sans)">Telefone</label><input id="c" type="tel" value="(11) 9999" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font:400 15px/1 var(--font-sans);border:2px solid var(--danger)"><span style="font-size:13px;font-weight:500;color:var(--danger)">Número incompleto.</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="d" style="font:600 14px/1.4 var(--font-sans);color:var(--fg-muted)">CPF</label><input id="d" type="text" disabled placeholder="Indisponível" style="height:44px;box-sizing:border-box;padding:0 12px;border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font:400 15px/1 var(--font-sans);border:1px solid var(--surface);background:var(--surface);color:var(--fg-muted)"><span style="font-size:13px;color:var(--fg-muted)">Desabilitado.</span></div>
</div>
<script></script>
