<!-- @dsCard group="Conteúdo" height=240 subtitle="Preenchido, contorno e inverso" -->
<div style="font-family:var(--font-sans);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:24px;background:var(--bg);color:var(--fg)">
<article style="display:flex;flex-direction:column;gap:12px;padding:32px;border-radius:var(--r-md);background:var(--surface)"><span style="font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted)">Preenchido</span><h3 style="margin:0;font:600 20px/1.3 var(--font-sans)">O que acontece</h3><p style="margin:0;font:400 16px/1.5 var(--font-sans)">O card principal de conteúdo.</p></article>
<article style="display:flex;flex-direction:column;gap:12px;padding:32px;border-radius:var(--r-md);border:1px solid var(--border)"><span style="font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted)">Contorno</span><h3 style="margin:0;font:600 20px/1.3 var(--font-sans)">O que precisamos</h3><p style="margin:0;font:400 16px/1.5 var(--font-sans)">O card secundário.</p></article>
<article style="display:flex;flex-direction:column;gap:12px;padding:32px;border-radius:var(--r-md);background:var(--inverse);color:var(--inverse-fg)"><span style="font:600 12px/1.4 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--highlight)">Inverso</span><h3 style="margin:0;font:600 20px/1.3 var(--font-sans)">Entregável</h3><p style="margin:0;font:400 16px/1.5 var(--font-sans)">O ponto mais importante da tela.</p></article>
</div>
